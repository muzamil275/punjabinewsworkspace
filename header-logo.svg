<text x="113" y="47" fill="#111a27" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" letter-spacing="-.7">Punjabi News</text>
<text x="114" y="76" fill="#2467d8" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="2.4">WORKSPACE</text>
