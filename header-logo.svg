<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" role="img" aria-labelledby="title desc">
<title id="title">Punjabi News Workspace</title>
<desc id="desc">Compact news globe icon with Punjabi News Workspace wordmark and Punjabi, English and Urdu editions.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#18395c"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe08a"/><stop offset=".55" stop-color="#ffb52e"/><stop offset="1" stop-color="#d96a21"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6fc8ff"/><stop offset="1" stop-color="#2467d8"/></linearGradient>
</defs>
<circle cx="55" cy="55" r="43" fill="url(#bg)" stroke="url(#gold)" stroke-width="3"/>
<ellipse cx="55" cy="55" rx="22" ry="43" fill="none" stroke="#74b9ff" stroke-opacity=".8" stroke-width="1.5"/>
