<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Punjabi News Workspace - today's top five news stories in English and Urdu."><meta name="theme-color" content="#071426"><title>Punjabi News Workspace</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#0d1d32;--line:#203754;--text:#f4f7fb;--muted:#9eb0c6;--accent:#62d5b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#123052 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}main{width:min(1050px,92%);margin:auto;padding:48px 0 70px}.brand{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}.hero{padding:65px 0 45px}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--muted);font-weight:800}.hero h1{font-size:clamp(38px,7vw,76px);line-height:.98;max-width:800px;margin:14px 0}.hero p{color:var(--muted);font-size:18px;max-width:650px;line-height:1.6}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:20px 0}.section-head h2{font-size:32px;margin:8px 0}.date{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:linear-gradient(145deg,#10243c,#0b192b);border:1px solid var(--line);border-radius:22px;padding:25px;min-height:220px;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 45px #0005}.card:first-child{grid-column:span 2}.rank{font-size:13px;color:var(--accent);font-weight:900}.category{float:right;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.card h3{font-size:25px;line-height:1.25;margin:35px 0 12px}.card p{color:#b9c7d8;line-height:1.65;margin:0}.status{padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);grid-column:1/-1}.error{color:#ffb4b4;border-color:#743838}@media(max-width:650px){main{padding-top:30px}.hero{padding-top:45px}.grid{grid-template-columns:1fr}.card:first-child{grid-column:auto}.section-head{align-items:start;flex-direction:column}.card h3{font-size:22px}}</style></head><body><main><div class="brand">Punjabi News Workspace</div><section class="hero"><div class="eyebrow">DAILY NEWS, WITHOUT THE NOISE</div><h1>Five stories worth your time.</h1><p>A focused English and Urdu news brief, loaded directly from the Supabase news table.</p></section><section><div class="section-head"><div><div class="eyebrow">TODAY'S TOP FIVE</div><h2>Top stories</h2></div><time id="date" class="date"></time></div><div id="news" class="grid" aria-live="polite"><div class="status">Loading today's brief...</div></div></section></main><script>const SUPABASE_URL='https://nkgbrynrzdlcsltymxaz.supabase.co',SUPABASE_KEY='sb_publishable_eS6PXjjPCI46j9-8gHV4Mw_OgjmfvNw',TABLE='top10newsofthisday';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const pick=(r,n)=>{for(const k of n)if(r[k]!=null&&String(r[k]).trim()!=='')return r[k];return''};async function load(){const box=document.getElementById('news');try{const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}}),data=await r.json();if(!r.ok)throw Error(data.message||data.error||`Supabase request failed (${r.status})`);const rows=Array.isArray(data)?data.slice(0,5):[];document.getElementById('date').textContent=new Intl.DateTimeFormat('en-PK',{dateStyle:'medium'}).format(new Date());box.innerHTML=rows.length?rows.map((row,i)=>{const text=pick(row,['news_text','title','headline','news','content','description']),id=pick(row,['id']);return `<article class="card"><span class="rank">0${i+1}</span><span class="category">ID ${esc(id)}</span><h3>${esc(text||'Untitled news')}</h3><p>News update from today's published feed.</p></article>`}).join(''):'<div class="status">No news records were found in the table.</div>'}catch(e){box.innerHTML=`<div class="status error">Failed to fetch news: ${esc(e.message)}</div>`}}load();</script></body></html>
